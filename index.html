<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Boston curb parking rules</title>
    <meta name="description" content="Every curb in Boston and the parking rule that applies, right now or any time you pick. Built on the city's open Curb Data Specification feed." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%233ea8ff'/%3E%3C/svg%3E" />
    <script>try{const t=localStorage.getItem("theme");document.documentElement.dataset.theme=(t==="light"||t==="dark")?t:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}</script>
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header>
        <div class="titlebar">
          <h1>Boston</h1>
          <button id="themeBtn" class="ghost" type="button">Light</button>
        </div>
        <p class="sub">Curb parking rules</p>
        <p class="tag">Every curb and the rule in force — pick a day and hour.</p>
      </header>

      <section class="card">
        <h2>When?</h2>
        <div class="row">
          <select id="day" aria-label="Day of week">
            <option value="mon">Mon</option><option value="tue">Tue</option><option value="wed">Wed</option>
            <option value="thu">Thu</option><option value="fri">Fri</option><option value="sat">Sat</option><option value="sun">Sun</option>
          </select>
          <input id="hour" type="range" min="0" max="23" step="1" value="12" aria-label="Hour" />
          <output id="hourLabel">12 PM</output>
        </div>
        <button id="nowBtn" class="ghost" type="button">Now</button>
      </section>

      <section class="card">
        <h2>Rules</h2>
        <ul id="legend" class="legend"></ul>
      </section>

      <section class="card">
        <h2>Layers</h2>
        <label class="toggle"><input type="checkbox" id="show3d" checked /> <span>3D buildings</span></label>
        <label class="toggle"><input type="checkbox" id="showMeters" /> <span>Parking meters</span></label>
        <label class="toggle"><input type="checkbox" id="showLabels" checked /> <span>Street names</span></label>
      </section>

      <footer>
        <div id="status" class="status">Loading curb data…</div>
        <small>Data: City of Boston <a href="https://www.boston.gov/curb-lab" target="_blank" rel="noopener">Curb Lab</a> CDS API + <a href="https://data.boston.gov" target="_blank" rel="noopener">Analyze Boston</a>. Not official guidance — read the sign.</small>
      </footer>
    </aside>

    <button id="panelToggle" aria-label="Toggle panel">☰</button>

    <div id="popup" class="popup hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
