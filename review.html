<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Curb review</title>
    <script>document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";</script>
  </head>
  <body class="review">
    <header class="rv-top">
      <h1>Curb review <a class="gh-small" href="https://github.com/alandev05/boston-curb-map" target="_blank" rel="noopener">GitHub</a></h1>
      <form id="login" class="rv-login" autocomplete="off">
        <input id="reviewer" placeholder="Your name" aria-label="Reviewer name" />
        <input id="token" type="password" placeholder="Admin token" aria-label="Admin token" />
        <button class="primary" type="submit">Load</button>
      </form>
    </header>
    <nav class="rv-tabs" id="tabs" role="tablist">
      <button type="button" data-status="pending" aria-selected="true">Pending</button>
      <button type="button" data-status="accepted">Accepted</button>
      <button type="button" data-status="rejected">Rejected</button>
      <button type="button" data-status="superseded">Superseded</button>
    </nav>
    <p id="msg" class="rv-msg"></p>
    <main id="list" class="rv-list"></main>
    <script type="module" src="/src/review.js"></script>
  </body>
</html>
