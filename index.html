<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Boston curb parking rules</title>
    <meta name="description" content="Every curb in Boston and the parking rule that applies, right now or any time you pick. Built on the city's open Curb Data Specification feed." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%233ea8ff'/%3E%3C/svg%3E" />
    <script>document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";try{localStorage.removeItem("theme")}catch(e){}</script>
  </head>
  <body>
    <div id="map"></div>

    <!-- Phones: search pill + one swipeable chip row over the map (the time chip and legend move here from the panel). -->
    <div id="topbar">
      <form id="search" class="search" role="search" autocomplete="off">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search Boston streets" aria-label="Search for a street or place" enterkeyhint="search" />
        <button id="settingsBtn" class="settings-btn" type="button" aria-label="Time, permits and layers" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
      </form>
      <ul id="searchResults" class="search-results" role="listbox" hidden></ul>
      <div id="chipRow" class="chip-row"></div>
    </div>

    <aside id="panel">
      <button id="sheetHandle" class="sheet-handle" type="button" aria-label="Show more options" aria-expanded="false"></button>
      <header>
        <div class="titlebar">
          <h1>Boston</h1>
          <button id="themeBtn" class="ghost" type="button">Light</button>
        </div>
      </header>

      <section class="card when">
        <button id="whenBtn" class="when-chip" type="button" aria-expanded="false" aria-controls="whenPanel">
          <span id="whenLabel">Now</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <small id="dateNote" class="date-note"></small>
        <div id="whenPanel" class="when-panel" hidden>
          <div class="time-head">
            <div class="daypick">
              <button id="dayBtn" class="day-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="dayList"><span id="dayLabel">Today</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
              <ul id="dayList" class="day-list" role="listbox" aria-label="Day" tabindex="-1" hidden></ul>
            </div>
            <output id="sliderOut" for="timeSlider"></output>
            <button id="nowBtn" class="link" type="button" hidden>↺ Now</button>
          </div>
          <div class="slider">
            <input id="timeSlider" type="range" min="0" max="1439" step="30" value="0" aria-label="Time of day" />
            <div class="slider-scale" aria-hidden="true"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div>
          </div>
        </div>
      </section>

      <section class="card rules-card">
        <h2>Rules</h2>
        <ul id="legend" class="legend"></ul>
      </section>

      <section class="card layers">
        <h2>Layers</h2>
        <label class="toggle"><input type="checkbox" id="showMeters" /> <span>Parking meters</span></label>
        <label class="toggle"><input type="checkbox" id="showLabels" checked /> <span>Street names</span></label>
      </section>

      <footer>
        <div id="status" class="status">Loading curb data…</div>
        <small>Data: City of Boston <a href="https://www.boston.gov/curb-lab" target="_blank" rel="noopener">Curb Lab</a> CDS API + <a href="https://data.boston.gov" target="_blank" rel="noopener">Analyze Boston</a>. Not official guidance — read the sign.</small>
      </footer>
    </aside>

    <button id="panelToggle" aria-label="Toggle panel">☰</button>

    <div id="popup" class="popup hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
